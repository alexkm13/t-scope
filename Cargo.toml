[package]
name = "t-scope"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "t-scope"
path = "src/main.rs"

[[bin]]
name = "collector"
path = "src/bin/collector.rs"

[[bin]]
name = "display"
path = "src/bin/display.rs"

[lib]
path = "src/lib.rs"

[dependencies]
apiresponse = "0.2"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
memmap2 = "0.9"
